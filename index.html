<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>禾林 RICH ONE 基地分析</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D site model; chapter text floats left over a fade, data widgets float right, chapter rail along the bottom. */
:root{
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC","PingFang TC",ui-monospace,monospace;
  --bg:#F2F2EF; --bgFade:rgba(242,242,239,.94); --bgFade0:rgba(242,242,239,0);
  --ink:#171717; --ink2:#505255; --ink3:#8A8C8F; --rule:rgba(23,23,23,.15); --btn:rgba(255,255,255,.74); --chip:#E5E5E0; --card:rgba(255,255,255,.82);
  --land:#EDEDE9; --road:#DFDFDA; --plaza:#F7F7F4; --bldg:#FFFFFF; --edge:#2F3133; --edgeOp:.26;
  --park:#AFC487; --tree:#86A556; --trunk:#6F6A60; --water:#C4D6DC; --constr:#E9E1CC;
  --glass:#A7BCC8; --slab:#FFFFFF; --rail:#C9CAC5;
  --accent:#B06E14; --accentSoft:#F0DDB6; --accentInk:#FFFFFF;
  --sun:#D99A1E; --sunSoft:#F3D58B; --wind:#2B9384; --windSoft:#B8DCD6;
  --res:#8FAEBA; --retail:#D7A253; --park2:#5E7F33; --base:#9AA0A4; --roof:#ECECE8;
  --r2:#6E9BC9; --r3:#2B9384; --r4:#B06E14;
  --hemiSky:#FFFFFF; --hemiGnd:#D4D5D1; --hemiI:.64; --dirI:.52;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --bgFade:rgba(19,20,22,.94); --bgFade0:rgba(19,20,22,0);
    --ink:#ECECEC; --ink2:#B3B5B8; --ink3:#7C7F83; --rule:rgba(236,236,236,.16); --btn:rgba(32,34,36,.78); --chip:#26282B; --card:rgba(28,30,32,.86);
    --land:#1A1B1D; --road:#26282B; --plaza:#202124; --bldg:#3A3D41; --edge:#B5B7BA; --edgeOp:.22;
    --park:#3D5428; --tree:#56733A; --trunk:#4A4640; --water:#1E3540; --constr:#2E2B24;
    --glass:#5D7A8B; --slab:#CFCFCF; --rail:#44474B;
    --accent:#E5A23F; --accentSoft:#4A3A1E; --accentInk:#141414;
    --sun:#F2B93B; --sunSoft:#6B5A2E; --wind:#4DB8AA; --windSoft:#23413D;
    --res:#5E8494; --retail:#C38E40; --park2:#86AD58; --base:#5D6266; --roof:#2E3033;
    --r2:#7FA9D6; --r3:#4DB8AA; --r4:#E5A23F;
    --hemiSky:#C8CDD6; --hemiGnd:#2A2C2E; --hemiI:.44; --dirI:.42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --bgFade:rgba(19,20,22,.94); --bgFade0:rgba(19,20,22,0);
  --ink:#ECECEC; --ink2:#B3B5B8; --ink3:#7C7F83; --rule:rgba(236,236,236,.16); --btn:rgba(32,34,36,.78); --chip:#26282B; --card:rgba(28,30,32,.86);
  --land:#1A1B1D; --road:#26282B; --plaza:#202124; --bldg:#3A3D41; --edge:#B5B7BA; --edgeOp:.22;
  --park:#3D5428; --tree:#56733A; --trunk:#4A4640; --water:#1E3540; --constr:#2E2B24;
  --glass:#5D7A8B; --slab:#CFCFCF; --rail:#44474B;
  --accent:#E5A23F; --accentSoft:#4A3A1E; --accentInk:#141414;
  --sun:#F2B93B; --sunSoft:#6B5A2E; --wind:#4DB8AA; --windSoft:#23413D;
  --res:#5E8494; --retail:#C38E40; --park2:#86AD58; --base:#5D6266; --roof:#2E3033;
  --r2:#7FA9D6; --r3:#4DB8AA; --r4:#E5A23F;
  --hemiSky:#C8CDD6; --hemiGnd:#2A2C2E; --hemiI:.44; --dirI:.42;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.drag{cursor:grabbing}
#fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--bgFade) 0%,var(--bgFade) 22%,var(--bgFade0) 44%)}
#fadeR{position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,var(--bgFade) 0%,var(--bgFade0) 24%);opacity:0;transition:opacity .5s}
#app.has-side #fadeR{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.webgl-fail{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13px}

/* top bar */
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;font-size:12.5px;letter-spacing:.04em;pointer-events:auto}
.brand b{font-weight:700;letter-spacing:.06em}
.brand i{font-style:normal;color:var(--ink2);border-left:1px solid var(--rule);padding-left:12px}
.ctrls{display:flex;gap:6px;pointer-events:auto}
.btn{border:1px solid var(--rule);background:var(--btn);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:3px;padding:6px 11px;font-size:12px;cursor:pointer;letter-spacing:.04em}
.btn:hover{border-color:var(--ink3)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.navb:focus-visible,.seg button:focus-visible,.tl-item:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* chapter panel */
#ui{position:absolute;inset:0;pointer-events:none}
#panel{position:absolute;left:max(32px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 76px);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  width:min(392px,34vw);overflow-y:auto;scrollbar-width:none;pointer-events:auto;display:flex;flex-direction:column;gap:18px;padding-right:6px}
#panel::-webkit-scrollbar{display:none}
#side{position:absolute;right:max(32px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);width:300px;max-height:calc(100% - 200px);overflow-y:auto;scrollbar-width:none;pointer-events:auto;display:flex;flex-direction:column;gap:14px}
#side::-webkit-scrollbar{display:none}
.in{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.15;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.in{animation:none}}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);letter-spacing:.06em}
.eyebrow .num{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:2px}
.kicker{margin:0;font-size:12.5px;color:var(--ink2);border:1px solid var(--rule);padding:6px 10px;align-self:flex-start;border-radius:2px;background:var(--btn)}
h1{margin:0;font-weight:300;font-size:clamp(30px,3.1vw,46px);line-height:1.24;letter-spacing:.03em;text-wrap:balance}
h1 em{font-style:normal;font-weight:500}
.sub{margin:-6px 0 0;font-size:15px;color:var(--ink2);letter-spacing:.04em}
.lead{font-size:14.5px;line-height:1.85;color:var(--ink2);max-width:36em}
.lead p{margin:0 0 .6em}
.lead b{color:var(--ink);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px solid var(--rule);padding-top:16px}
.stat b{display:block;font-family:var(--mono);font-weight:300;font-size:30px;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b i{font-style:normal;font-size:12px;margin-left:3px;color:var(--ink2);letter-spacing:0}
.stat span{display:block;margin-top:6px;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--rule);padding:4px 9px;border-radius:2px;background:var(--btn)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--ink3);margin:0}
.foot{margin:auto 0 0;font-size:11px;line-height:1.7;color:var(--ink3);border-top:1px solid var(--rule);padding-top:10px}
.foot a{color:inherit}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;border-top:1px solid var(--rule);padding-top:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend small{color:var(--ink3);font-size:11.5px;margin-left:auto;text-align:right}
.sw{width:22px;height:12px;border-radius:2px;flex:none;border:1px solid var(--rule)}
.sw.line{height:0;border:none;border-top:2px solid}
.sw.dash{height:0;border:none;border-top:2px dashed}
.blist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:13px;line-height:1.65;color:var(--ink2)}
.blist li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.blist li::before{content:"";width:8px;height:8px;border:1.5px solid var(--ink);border-radius:50%;margin-top:6px}
.blist b{color:var(--ink);font-weight:500}

/* timeline list */
.tl{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--rule);margin-left:4px}
.tl-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;border:0;background:none;padding:5px 0 5px 0;cursor:pointer;position:relative}
.tl-item::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink3);margin-left:-5px;margin-top:4px}
.tl-item.on::before{background:var(--accent);border-color:var(--accent)}
.tl-item.past::before{border-color:var(--ink)}
.tl-item .y{font-family:var(--mono);font-size:12px;color:var(--ink3);display:block}
.tl-item.on .y{color:var(--accent)}
.tl-item .t{font-size:13px;display:block;color:var(--ink2)}
.tl-item.on .t{color:var(--ink);font-weight:500}

/* side cards */
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--ink2)}
.bigyear{font-family:var(--mono);font-weight:300;font-size:40px;line-height:1;letter-spacing:-.01em}
.card .ttl{font-size:15px;font-weight:500}
.card p{margin:0;font-size:13px;line-height:1.75;color:var(--ink2)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;font-size:12px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.readout div b{display:block;font-family:var(--mono);font-weight:300;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.readout div span{font-size:11px;color:var(--ink3)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row .btn{padding:5px 9px;min-width:34px}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:86px 1fr 46px;align-items:center;gap:8px;font-size:12px}
.bar .tr{height:8px;background:var(--chip);border-radius:1px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--sun)}
.bar em{font-style:normal;font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
svg text{font-family:var(--mono)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.months div{text-align:center;font-family:var(--mono);font-size:9.5px;padding:5px 0;border-radius:1px}
.months .ne{background:var(--wind);color:var(--bg)}
.months .sw2{background:var(--accent);color:var(--accentInk)}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;border-top:1px solid var(--rule);padding-top:16px}
.sumgrid div b{display:block;font-family:var(--mono);font-weight:300;font-size:26px;line-height:1.15;white-space:nowrap}
.sumgrid div span{font-size:11.5px;color:var(--ink3);line-height:1.5;display:block;margin-top:4px}
.src{margin:0;padding:0;list-style:none;font-size:11.5px;line-height:1.65;color:var(--ink3);display:flex;flex-direction:column;gap:5px}
.src a{color:var(--ink2)}

/* labels */
.lbl{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.lbl .tx{position:absolute;left:0;bottom:var(--stem,28px);transform:translateX(-50%);white-space:nowrap;font-size:11.5px;line-height:1.35;color:var(--ink);text-align:center;
  text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg)}
.lbl .tx small{display:block;font-size:10.5px;color:var(--ink2)}
.lbl .stem{position:absolute;left:-.5px;bottom:0;width:1px;height:var(--stem,28px);background:var(--ink);opacity:.8}
.lbl .stem::after{content:"";position:absolute;left:-2px;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.lbl.box .tx{background:var(--ink);color:var(--bg);text-shadow:none;padding:3px 8px;border-radius:2px}
.lbl.box .tx small{color:var(--bg);opacity:.75}
.lbl.acc .tx{background:var(--accent);color:var(--accentInk);text-shadow:none;padding:3px 8px;border-radius:2px}
.lbl.acc .tx small{color:var(--accentInk);opacity:.8}
.lbl.acc .stem,.lbl.acc .stem::after{background:var(--accent)}
.lbl.wind .tx{color:var(--wind);font-weight:500}
.lbl.wind .stem,.lbl.wind .stem::after{background:var(--wind)}
.lbl.tag .tx{bottom:auto;top:0;transform:translate(-50%,-50%)}
.lbl.tag .stem{display:none}
.lbl.road .tx{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink2)}
.lbl.ring .tx{font-family:var(--mono);font-size:10.5px;color:var(--ink2);background:var(--btn);padding:1px 5px;border:1px solid var(--rule);text-shadow:none;border-radius:2px}
.lbl.cmp .tx{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--sun)}

/* nav */
#nav{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:14px;
  padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
#chapters{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule)}
#chapters::-webkit-scrollbar{display:none}
.navb{flex:1 0 auto;border:0;background:none;cursor:pointer;padding:9px 6px 2px;text-align:left;font-size:11.5px;color:var(--ink3);white-space:nowrap;position:relative}
.navb span{font-family:var(--mono);font-size:10.5px;margin-right:5px}
.navb::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.navb[aria-current="step"]{color:var(--ink)}
.navb[aria-current="step"]::before{background:var(--ink)}
.navb:hover{color:var(--ink)}
.arrows{display:flex;gap:4px}
.arrows .btn{padding:5px 10px;font-family:var(--mono)}
#compass{position:absolute;right:max(32px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:40px;height:40px;pointer-events:none}
#scale{position:absolute;right:calc(max(32px,env(safe-area-inset-right,0px)) + 56px);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);font-family:var(--mono);font-size:10.5px;color:var(--ink2);pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#scale i{display:block;height:5px;border:1px solid var(--ink2);border-top:0}
#draghint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);font-size:11.5px;color:var(--ink2);border:1px solid var(--rule);background:var(--btn);padding:5px 12px;border-radius:2px;pointer-events:none;transition:opacity .6s}

/* narrow screens: model on top, chapter sheet below */
@media (max-width: 820px){
  #fade{background:linear-gradient(0deg,var(--bg) 0%,var(--bg) 46%,var(--bgFade0) 60%)}
  #fadeR{display:none}
  .top{top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand i{display:none}
  .btn{padding:5px 8px;font-size:11.5px}
  #ui{position:absolute;left:0;right:0;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);height:50%;overflow-y:auto;pointer-events:auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 18px;display:flex;flex-direction:column;gap:16px;
    border-top:1px solid var(--rule);background:var(--bg)}
  #panel,#side{position:static;width:auto;max-height:none;overflow:visible;padding:0}
  #panel{gap:14px}
  h1{font-size:26px}
  .stat b{font-size:22px}
  .foot{margin-top:4px}
  #nav{bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
  .navb{flex:0 0 auto}
  #compass{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 52px);bottom:auto;width:34px;height:34px}
  #scale{display:none}
  #draghint{display:none}
}
</style>
<meta name="description" content="青埔禾林 RICH ONE 雙塔的 3D 基地環境分析：區位、量體、日照、陰影、風場、視野、交通、實價行情與站前開發。">
</head>
<body>


<div id="app">
  <canvas id="gl" tabindex="-1" aria-label="禾林 RICH ONE 周邊三維模型，可拖曳旋轉"></canvas>
  <div id="fade"></div><div id="fadeR"></div>
  <div id="labels" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><b>禾林 RICH ONE</b><i>青埔・基地環境分析</i></div>
    <div class="ctrls">
      <button class="btn" id="bAuto" aria-pressed="false">自動播放</button>
      <button class="btn" id="bTheme" aria-label="切換明暗">明暗</button>
      <button class="btn" id="bFull">全螢幕</button>
    </div>
  </header>
  <div id="ui">
    <section id="panel" aria-live="polite"></section>
    <aside id="side" hidden></aside>
  </div>
  <svg id="compass" viewBox="-20 -20 40 40" aria-hidden="true"><circle r="18" style="fill:var(--btn);stroke:var(--rule)"/><g id="needle"><path d="M0-11 L3.6 2 L0 0 L-3.6 2Z" style="fill:var(--ink)"/><path d="M0 11 L3.6 2 L0 0 L-3.6 2Z" style="fill:var(--ink3);opacity:.5"/><text y="-12.5" x="0" font-size="6.5" text-anchor="middle" style="fill:var(--ink)">N</text></g></svg>
  <div id="scale"><span id="scaleT">100 m</span><i id="scaleB" style="width:60px"></i></div>
  <div id="draghint">在模型上拖曳可旋轉視角・滾輪縮放</div>
  <nav id="nav" aria-label="章節">
    <div id="chapters"></div>
    <div class="arrows"><button class="btn" id="bPrev" aria-label="上一章">←</button><button class="btn" id="bNext" aria-label="下一章">→</button></div>
  </nav>

  if(o.length>2){const a=o[0],z=o[o.length-1]; if(Math.hypot(a[0]-z[0],a[1]-z[1])<0.05) o.pop();}
  return o;
}
function ccw(pts){let a=0; for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length]; a+=p[0]*q[1]-q[0]*p[1];} return a>=0?pts:pts.slice().reverse();}
function polyArea(pts){let a=0; for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length]; a+=p[0]*q[1]-q[0]*p[1];} return Math.abs(a)/2;}
function extrude(b,pts,h0,h1,opt){
  pts=ccw(clean(pts)); const n=pts.length; if(n<3) return;
  for(let i=0;i<n;i++){
    const a=pts[i],c=pts[(i+1)%n]; const dx=c[0]-a[0],dy=c[1]-a[1],L=Math.hypot(dx,dy); if(L<1e-3) continue;
    const nr=[dy/L,0,dx/L];
    const A0=[a[0],h0,-a[1]],B0=[c[0],h0,-c[1]],B1=[c[0],h1,-c[1]],A1=[a[0],h1,-a[1]];
    tri(b,A0,B0,B1,nr); tri(b,A0,B1,A1,nr);
    if(!(opt&&opt.noEdges)){
      b.e.push(a[0],h1,-a[1],c[0],h1,-c[1]);
      const pv=pts[(i-1+n)%n]; const ex=a[0]-pv[0],ey=a[1]-pv[1],eL=Math.hypot(ex,ey);
      if(eL>1e-3){const cos=(ex*dx+ey*dy)/(eL*L); if(cos<0.94) b.e.push(a[0],h0,-a[1],a[0],h1,-a[1]);}
    }
  }
  let tris; try{tris=THREE.ShapeUtils.triangulateShape(pts.map(p=>new THREE.Vector2(p[0],p[1])),[]);}catch(e){tris=[];}
  for(const t of tris){
    triUp(b,[pts[t[0]][0],h1,-pts[t[0]][1]],[pts[t[1]][0],h1,-pts[t[1]][1]],[pts[t[2]][0],h1,-pts[t[2]][1]]);
    if(opt&&opt.bottom) triDown(b,[pts[t[0]][0],h0,-pts[t[0]][1]],[pts[t[1]][0],h0,-pts[t[1]][1]],[pts[t[2]][0],h0,-pts[t[2]][1]]);
  }
}
function flat(b,pts,y){
  pts=ccw(clean(pts)); if(pts.length<3) return;
  let tris; try{tris=THREE.ShapeUtils.triangulateShape(pts.map(p=>new THREE.Vector2(p[0],p[1])),[]);}catch(e){return;}
  for(const t of tris) triUp(b,[pts[t[0]][0],y,-pts[t[0]][1]],[pts[t[1]][0],y,-pts[t[1]][1]],[pts[t[2]][0],y,-pts[t[2]][1]]);
}
function ribbon(b,line,w,y,caps){
  const hw=w/2;
  for(let i=0;i<line.length-1;i++){
    const a=line[i],c=line[i+1]; const dx=c[0]-a[0],dy=c[1]-a[1],L=Math.hypot(dx,dy); if(L<1e-3) continue;
    const nx=-dy/L*hw, ny=dx/L*hw;
    const p1=[a[0]+nx,y,-(a[1]+ny)],p2=[a[0]-nx,y,-(a[1]-ny)],p3=[c[0]-nx,y,-(c[1]-ny)],p4=[c[0]+nx,y,-(c[1]+ny)];
    triUp(b,p1,p2,p3); triUp(b,p1,p3,p4);
  }
  if(caps!==false){
    for(let i=1;i<line.length-1;i++){
      const p=line[i]; const k=8; const ctr=[p[0],y,-p[1]];
      for(let j=0;j<k;j++){const a0=j/k*2*Math.PI,a1=(j+1)/k*2*Math.PI;
        triUp(b,ctr,[p[0]+Math.cos(a0)*hw,y,-(p[1]+Math.sin(a0)*hw)],[p[0]+Math.cos(a1)*hw,y,-(p[1]+Math.sin(a1)*hw)]);}
    }
  }
}
function geomOf(b){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(b.p,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(b.n,3));
  return g;
}
function edgesOf(b){const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(b.e,3)); return g;}
function lineGeom(pts,y){const a=[]; for(const p of pts) a.push(p[0],y,-p[1]); const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(a,3)); return g;}
function rectUV(u0,u1,v0,v1){return [uv(u0,v0),uv(u1,v0),uv(u1,v1),uv(u0,v1)];}
function pip(x,y,poly){let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j]; if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c;} return c;}
function rng(seed){let s=seed>>>0||1; return ()=>{s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%100000)/100000;};}

/* ============================================================
   SOLAR POSITION (NOAA)
   ============================================================ */
function sunPos(doy,hour){
  const g=2*Math.PI/365*(doy-1+(hour-12)/24);
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const tst=hour*60+eqt+4*LON-480; const ha=(tst/4-180)*DEG, la=LAT*DEG;
  const cz=Math.sin(la)*Math.sin(decl)+Math.cos(la)*Math.cos(decl)*Math.cos(ha);
  const zen=Math.acos(Math.max(-1,Math.min(1,cz)));
  let az=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(decl)*Math.cos(la))/DEG+180;
  return {alt:90-zen/DEG, az:(az+360)%360};
}
function sunDir(s){const a=s.alt*DEG,z=s.az*DEG; return new THREE.Vector3(Math.cos(a)*Math.sin(z),Math.sin(a),-Math.cos(a)*Math.cos(z));}
function riseSet(doy){let r=null,s=null; for(let m=240;m<=1260;m++){const p=sunPos(doy,m/60); if(p.alt>-0.83){ if(r===null) r=m; s=m; }} return [r/60,s/60];}
const FACADES=[{k:'B 棟東南面',n:132.3},{k:'A 棟西南面',n:222.3},{k:'B 棟西北面',n:312.3},{k:'A 棟東北面',n:42.3}];
function facadeHours(doy){return FACADES.map(f=>{let c=0; for(let m=240;m<=1260;m+=5){const p=sunPos(doy,m/60); if(p.alt>2&&Math.cos((p.az-f.n)*DEG)>0) c+=5;} return c/60;});}
const sunState={doy:110,hour:10.5};
function setSun(doy,hour,showDome){

let wind=null;
{
  const N=(innerWidth<900)?380:760; const R=340;
  const pg=new THREE.PlaneGeometry(1,1); pg.rotateX(-Math.PI/2);
  const streaks=new THREE.InstancedMesh(pg,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}),N);
  streaks.frustumCulled=false; const sm4=new THREE.Matrix4(), sq=new THREE.Quaternion(), ss=new THREE.Vector3(), sp=new THREE.Vector3(), yAx=new THREE.Vector3(0,1,0), tmpC=new THREE.Color();
  for(let i=0;i<N;i++) streaks.setColorAt(i,new THREE.Color(1,1,1));
  const WG=group('wind'); WG.add(streaks); WG.visible=false;
  const P2=[]; const rnd=rng(42);
  let dirFrom=45;
  function flow(){const b=(dirFrom+180)*DEG; return [Math.sin(b),Math.cos(b)];}
  function spawn(p,anywhere){
    const f=flow(); const px=-f[1],py=f[0];
    if(anywhere){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*R; p.x=CENTER[0]+Math.cos(a)*r; p.y=CENTER[1]+Math.sin(a)*r;}
    else{const s=(rnd()*2-1)*R; p.x=CENTER[0]-f[0]*R*0.98+px*s; p.y=CENTER[1]-f[1]*R*0.98+py*s;}
    p.h=8+rnd()*46; p.age=0; p.life=5+rnd()*6; p.vx=f[0]; p.vy=f[1];
  }
  for(let i=0;i<N;i++){const p={}; spawn(p,true); p.age=rnd()*p.life; P2.push(p);}
  const rects=[TW.A,TW.B];
  function step(dt,speed){
    const f=flow(); const base=speed*26;
    const bg=COL.bg, wc=COL.wind;
    for(let i=0;i<N;i++){
      const p=P2[i];
      let vx=f[0], vy=f[1];
      // deflect in site frame
      const q=toUV(p.x,p.y); let boost=1;
      for(const T of rects){
        const m=16; if(q[0]<T.u[0]-m||q[0]>T.u[1]+m||q[1]<T.v[0]-m||q[1]>T.v[1]+m) continue;
        if(p.h>towerH(T.floors)) continue;
        const cu=Math.max(T.u[0],Math.min(T.u[1],q[0])), cv=Math.max(T.v[0],Math.min(T.v[1],q[1]));
        let du=q[0]-cu, dv=q[1]-cv; const d=Math.hypot(du,dv);
        if(d<0.3){ spawn(p,false); break; }
        du/=d; dv/=d; const k=Math.max(0,(m-d)/m);
        // outward push, converted from uv to xy
        vx+=(du*UU[0]+dv*VV[0])*k*1.7; vy+=(du*UU[1]+dv*VV[1])*k*1.7; boost=Math.max(boost,1+k*0.9);
      }
      const L=Math.hypot(vx,vy)||1; vx=vx/L*base*boost; vy=vy/L*base*boost;
      p.vx=vx; p.vy=vy;
      p.x+=vx*dt; p.y+=vy*dt; p.age+=dt;
      const dc=Math.hypot(p.x-CENTER[0],p.y-CENTER[1]);
      if(p.age>p.life||dc>R*1.02) spawn(p,false);
      const sp2=Math.hypot(vx,vy), len=Math.max(6,sp2*0.85);
      const fade=Math.min(1,p.age/0.8,(p.life-p.age)/0.8)*Math.max(0,1-Math.max(0,dc-R*0.6)/(R*0.4));
      const hot=Math.min(1,(boost-1)/0.9);
      sp.set(p.x-vx*0.375,p.h,-(p.y-vy*0.375)); sq.setFromAxisAngle(yAx,Math.atan2(vy,vx)); ss.set(len,1,2.2);
      sm4.compose(sp,sq,ss); streaks.setMatrixAt(i,sm4);
      tmpC.copy(wc).lerp(COL.accent,hot); tmpC.lerp(bg,1-fade); streaks.setColorAt(i,tmpC);
    }
    streaks.instanceMatrix.needsUpdate=true; if(streaks.instanceColor) streaks.instanceColor.needsUpdate=true;
  }
  wind={group:WG,step,setDir:d=>{dirFrom=d;},recolor:()=>{},speed:1};
}

const rig={t:new THREE.Vector3(),d:600,az:200,el:35};
const from={}, to={}; let tw=null;
let fovGoal=30;
function setCam(c,instant){
  fovGoal=c.fov||30; if(instant){camera.fov=fovGoal; camera.updateProjectionMatrix();}
  const t=W3(c.t[0],c.t[1],c.t[2]||0);
  const dd=(NARROW()&&!c.fov)?c.d*1.35:c.d;
  to.t=t; to.d=dd; to.az=c.az; to.el=c.el;
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){ rig.t.copy(t); rig.d=dd; rig.az=c.az; rig.el=c.el; tw=null; return; }
  from.t=rig.t.clone(); from.d=rig.d; from.az=rig.az; from.el=rig.el;
  let daz=((to.az-from.az)%360+540)%360-180; to.az=from.az+daz;
  tw={t0:performance.now(),dur:c.dur||1700};
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function updateRig(now){
  if(tw){
    let k=(now-tw.t0)/tw.dur; if(k>=1){k=1;}
    const e=ease(k);
    rig.t.lerpVectors(from.t,to.t,e);
    // fly-over arc for long moves: rise mid-way
    const far=from.t.distanceTo(to.t);
    const lift=far>300?Math.sin(e*Math.PI)*Math.min(.35,far/4000):0;
    rig.d=(from.d+(to.d-from.d)*e)*(1+lift);
    rig.az=from.az+(to.az-from.az)*e; rig.el=from.el+(to.el-from.el)*e;
    if(k>=1) tw=null;
  }
  const el=rig.el*DEG, az=rig.az*DEG, h=rig.d*Math.cos(el);
  camera.position.set(rig.t.x+Math.sin(az)*h, rig.t.y+rig.d*Math.sin(el), rig.t.z-Math.cos(az)*h);
  camera.lookAt(rig.t);
  if(Math.abs(camera.fov-fovGoal)>0.05){camera.fov+=(fovGoal-camera.fov)*0.08; camera.updateProjectionMatrix();}
  const near=Math.max(1.5,rig.d*0.025); if(Math.abs(camera.near-near)>0.5){camera.near=near; camera.updateProjectionMatrix();}
  scene.fog.near=rig.d*1.05; scene.fog.far=rig.d*2.6+600;

function mountSun(){
  const rr=document.getElementById('sRange'); const bars=document.getElementById('sBars');
  const segs=[...document.querySelectorAll('[data-doy]')];

    const s=setSun(sunState.doy,sunState.hour,true);
    const hh=Math.floor(sunState.hour), mm=Math.round((sunState.hour-hh)*60);
    document.getElementById('sT').textContent=String(hh).padStart(2,'0')+':'+String(mm%60).padStart(2,'0');
    document.getElementById('sAl').textContent=s.alt>0?s.alt.toFixed(1)+'°':'—';
    document.getElementById('sAz').textContent=s.az.toFixed(0)+'°';
    document.getElementById('sSh').textContent=s.alt>1?Math.round(towerH(22)/Math.tan(s.alt*DEG))+' m':'—';

  }

function mountWind(){
  const segs=[...document.querySelectorAll('[data-w]')];
  const months=document.getElementById('wMonths');
  months.innerHTML=Object.keys(WIND.monthly).sort((a,b)=>a-b).map(m=>{const t=WIND.monthly[m].top; const ne=['NE','NNE','ENE'].includes(t); return `<div class="${ne?'ne':'sw2'}" title="${m} 月：${DIRZH[t]}風">${ne?'NE':'SW'}</div>`;}).join('');
  function draw(mode){
    windMode=mode; segs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===mode)));
    const S=WIND.season[mode]; const svg=document.getElementById('rose');
    const max=40, R=92; const sc=f=>Math.sqrt(f/max)*R;
    let h='';
    for(const r of [10,20,30,40]){h+=`<circle r="${sc(r).toFixed(1)}" fill="none" stroke="var(--rule)"/>`; h+=`<text x="3" y="${(-sc(r)-2).toFixed(1)}" font-size="7.5" fill="var(--ink3)">${r}%</text>`;}
    h+=`<line x1="0" y1="-${R+6}" x2="0" y2="${R+6}" stroke="var(--rule)"/><line x1="-${R+6}" y1="0" x2="${R+6}" y2="0" stroke="var(--rule)"/>`;
    // 青商路 axis 42°
    const a=42.3*DEG; h+=`<line x1="${(-Math.sin(a)*(R+10)).toFixed(1)}" y1="${(Math.cos(a)*(R+10)).toFixed(1)}" x2="${(Math.sin(a)*(R+10)).toFixed(1)}" y2="${(-Math.cos(a)*(R+10)).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="4 3"/>`;
    h+=`<text x="${(Math.sin(a)*(R+2)+4).toFixed(1)}" y="${(-Math.cos(a)*(R+2)+12).toFixed(1)}" font-size="8" fill="var(--accent)">青商路</text>`;
    S.freq.forEach((f,i)=>{ if(f<=0) return; const c=i*22.5*DEG, w=9*DEG, r=sc(f);
      const p1=[Math.sin(c-w)*r,-Math.cos(c-w)*r], p2=[Math.sin(c+w)*r,-Math.cos(c+w)*r];
      const op=(0.35+Math.min(1,S.spd[i]/9)*0.65).toFixed(2);
      h+=`<path d="M0 0L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="var(--wind)" fill-opacity="${op}" stroke="var(--bg)" stroke-width=".6"/>`; });
    for(const [t,x,y] of [['N',0,-R-10],['E',R+11,3],['S',0,R+15],['W',-R-11,3]]) h+=`<text x="${x}" y="${y}" font-size="9" text-anchor="middle" fill="var(--ink2)">${t}</text>`;
    svg.innerHTML=resv(h);
    let top=0; S.freq.forEach((f,i)=>{if(f>S.freq[top]) top=i;});
    document.getElementById('wDir').innerHTML=DIRS[top]+' <small style="font-size:13px">'+S.freq[top].toFixed(1)+'%</small>';
    document.getElementById('wMean').innerHTML=S.mean.toFixed(1)+'<small style="font-size:12px"> m/s</small>';
    const fromDeg=top*22.5; wind.setDir(fromDeg);
    const summer=(mode==='JJA');
    LB.wNE.el.querySelector('.tx').innerHTML=summer?'西南偏西風<small>WSW・'+S.freq[top].toFixed(1)+'%</small>':'東北季風<small>'+DIRS[top]+'・'+S.freq[top].toFixed(1)+'%</small>';
    const up=fromDeg*DEG; LB.wNE.pos.copy(W3(CENTER[0]+Math.sin(up)*250,CENTER[1]+Math.cos(up)*250,40));

  }
  segs.forEach(b=>b.addEventListener('click',()=>{draw(b.dataset.w); userTouched();}));

addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT')) return;
  if(e.key===' '&&e.target&&e.target.tagName==='BUTTON') return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault(); next(); userTouched();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault(); prev(); userTouched();}
  else if(e.key==='f'||e.key==='F'){toggleFull();}
  else if(e.key==='Home'){go(0);}
});
// autoplay
const bAuto=document.getElementById('bAuto');
function stopAuto(){ if(autoTimer){clearInterval(autoTimer); autoTimer=null;} bAuto.setAttribute('aria-pressed','false'); }
function userTouched(){ const h=document.getElementById('draghint'); if(h) h.style.opacity=0; }
bAuto.addEventListener('click',()=>{
  if(autoTimer){stopAuto(); return;}
  bAuto.setAttribute('aria-pressed','true');
  autoTimer=setInterval(()=>{ if(cur>=CH.length-1) go(0); else next(); },9000);
});
['pointerdown','wheel'].forEach(ev=>canvas.addEventListener(ev,()=>{ if(autoTimer) stopAuto(); }));
// theme
document.getElementById('bTheme').addEventListener('click',()=>{
  root.setAttribute('data-theme',isDark()?'light':'dark'); applyTheme(); refreshWidgets();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!root.getAttribute('data-theme')){applyTheme(); refreshWidgets();} });
function refreshWidgets(){ const c=CH[cur]; if(!c) return; if(c.key==='wind') mountWind(); if(c.key==='skyline') drawSky(); if(c.key==='market') drawPx(); if(c.key==='sun'&&CUR.sunDraw) CUR.sunDraw(); }
// fullscreen
function toggleFull(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }
document.getElementById('bFull').addEventListener('click',toggleFull);

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
let VW=0,VH=0;
function resize(){
  VW=app.clientWidth; VH=app.clientHeight;
  if(renderer) renderer.setSize(VW,VH,false);
  camera.aspect=VW/VH;
  if(NARROW()) camera.setViewOffset(VW,VH,0,VH*0.24,VW,VH);
  else camera.setViewOffset(VW,VH,-VW*0.13,0,VW,VH);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
const v3=new THREE.Vector3();
const needle=document.getElementById('needle');
const scaleT=document.getElementById('scaleT'), scaleB=document.getElementById('scaleB');
function updateLabels(){
  for(const L of LABELS){
    if(!L.on){ if(L.shown){L.el.style.display='none'; L.shown=false;} continue; }
    v3.copy(L.pos).project(camera);
    const ok=v3.z<1&&v3.z>-1&&Math.abs(v3.x)<1.15&&Math.abs(v3.y)<1.15;
    if(!ok){ if(L.shown){L.el.style.display='none'; L.shown=false;} continue; }
    const x=(v3.x*.5+.5)*VW, y=(-v3.y*.5+.5)*VH;
    L.el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
    if(!L.shown){L.el.style.display='block'; L.shown=true;}
  }
}
let last=performance.now(), routeT=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const c=CH[cur]||{};
  if(c.cam&&c.cam.orbit&&!tw&&!pts.size&&!matchMedia('(prefers-reduced-motion: reduce)').matches) rig.az+=dt*2.2;
  updateRig(now);
  if(G.wind.visible) wind.step(dt,1);
  if(ROUTE.visible){ routeT+=dt*90; const dots=ROUTE.userData.dots; const m4=new THREE.Matrix4(); const Lr=routeCum[routeCum.length-1];
    for(let i=0;i<dots.count;i++){const p=routeAt(routeT+i*Lr/dots.count); m4.makeTranslation(p[0],2.4,-p[1]); dots.setMatrixAt(i,m4);} dots.instanceMatrix.needsUpdate=true; }
  if(MARK.visible){ const k=(now/1400)%1; MARK.userData.r2.scale.setScalar(1+k*1.8); MARK.userData.r2.material.opacity=0.9; }
  if(c.key==='sun'&&sunPlay&&CUR.sunDraw){ sunState.hour+=dt*1.2; const [r,s]=riseSet(sunState.doy); if(sunState.hour>s+0.3) sunState.hour=r-0.2; CUR.sunDraw(); }
  if(c.key==='shadow'&&shadowAuto&&CUR.shadowDraw){ sunState.hour+=dt*0.75; if(sunState.hour>16.6) sunState.hour=7.4; CUR.shadowDraw(); }
  if(renderer) renderer.render(scene,camera);
  updateLabels();
  // compass + scale
  needle.setAttribute('transform',`rotate(${(-(rig.az-180)).toFixed(1)})`);
  const mpp=2*rig.d*Math.tan(camera.fov/2*DEG)/VH; const opts=[20,50,100,200,500,1000]; let m=opts[0]; for(const o of opts){ if(o/mpp<=110) m=o; }
  scaleT.textContent=m>=1000?(m/1000)+' km':m+' m'; scaleB.style.width=Math.max(8,m/mpp).toFixed(0)+'px';
  requestAnimationFrame(loop);
}
/* ============================================================
   BOOT
   ============================================================ */
applyTheme(); resize();
const start=Math.max(0,CH.findIndex(c=>'#'+c.key===location.hash));
go(start,true);
addEventListener('hashchange',()=>{const k=CH.findIndex(c=>'#'+c.key===location.hash); if(k>=0&&k!==cur) go(k);});
requestAnimationFrame(loop);
setTimeout(()=>{const h=document.getElementById('draghint'); if(h) h.style.opacity=0;},9000);
})();
</script>
